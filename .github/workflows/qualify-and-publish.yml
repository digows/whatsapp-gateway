name: Qualify and publish gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact main commit accepted by Architect for publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify ${{ matrix.platform.architecture }} / Redis ${{ matrix.redis }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
        redis: ['8.2.10', '8.10.2']
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: gateway-fixture-only
          POSTGRES_DB: gateway_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d gateway_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:${{ matrix.redis }}
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GATEWAY_TEST_DATABASE_URL: postgresql://fixture_runtime:gateway-runtime-only@127.0.0.1:5432/gateway_fixture
      GATEWAY_TEST_ADMIN_DATABASE_URL: postgresql://fixture_admin:gateway-fixture-only@127.0.0.1:5432/gateway_fixture
      GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Validate release metadata and annotated tag
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node scripts/release.mjs check "$RELEASE_TAG")
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            test -f "docs/releases/$version.md"
            node --input-type=module <<'JS'
          const {RELEASE_TAG,GITHUB_REPOSITORY,GH_TOKEN}=process.env;
          const response=await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}`,{
            headers:{authorization:`Bearer ${GH_TOKEN}`,accept:'application/vnd.github+json'}
          });
          if(response.status!==404)throw new Error(`Release must be unpublished; GitHub returned ${response.status}`);
          JS
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Configure runner-owned temporary paths
        run: |
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/gateway-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GATEWAY_TEST_PNPM_STORE=%s/pnpm-store\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Select the pinned package manager
        run: npm install --global pnpm@12.9.1
      - name: Install and compile
        run: |
          pnpm --store-dir "$GATEWAY_TEST_PNPM_STORE" install --frozen-lockfile
          pnpm build
      - name: Install the PostgreSQL fixture client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare isolated PostgreSQL and Redis fixtures
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const configuration = {
            storage: {engine:'postgresql',mode:'cluster',url:process.env.GATEWAY_TEST_ADMIN_DATABASE_URL},
            workspaces:[{workspaceId:'00000000-0000-4000-8000-000000000001'}],
            http:{enabled:false}
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gateway-admin.json',JSON.stringify(configuration),{mode:0o600});
          JS
          node runtime/dist/cli.js migrate --config "$RUNNER_TEMP/gateway-admin.json"
          psql "$GATEWAY_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE fixture_runtime LOGIN PASSWORD 'gateway-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE gateway_fixture TO fixture_runtime;
          GRANT USAGE ON SCHEMA gateway TO fixture_runtime;
          GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA gateway TO fixture_runtime;
          GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA gateway TO fixture_runtime;
          SQL
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly yes
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendfsync always
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET maxmemory-policy noeviction
      - name: Run all configured checks
        run: pnpm check | tee "$RUNNER_TEMP/gateway-check.log"
      - name: Record the native test environment
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          EXPECTED_REDIS: ${{ matrix.redis }}
          EXPECTED_ARCHITECTURE: ${{ matrix.platform.architecture }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const server=execFileSync('docker',['exec',process.env.REDIS_CONTAINER,'redis-cli','INFO','server'],{encoding:'utf8'});
          const version=server.match(/^redis_version:([^\r\n]+)/m)?.[1];
          const expectedNode=process.env.EXPECTED_ARCHITECTURE==='amd64'?'x64':'arm64';
          if(version!==process.env.EXPECTED_REDIS||process.arch!==expectedNode)throw new Error('Native test environment mismatch');
          fs.writeFileSync(process.env.RUNNER_TEMP+'/gateway-fixture.json',JSON.stringify({
            revision:process.env.GITHUB_SHA,node:process.version,architecture:process.arch,redis:version
          },null,2));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-checks-${{ github.sha }}-${{ matrix.platform.architecture }}-redis-${{ matrix.redis }}
          path: |
            ${{ runner.temp }}/gateway-check.log
            ${{ runner.temp }}/gateway-fixture.json
      - name: Package the consumer artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-packages"
          pnpm --store-dir "$GATEWAY_TEST_PNPM_STORE" --dir packages/contracts pack --pack-destination "$RUNNER_TEMP/gateway-packages"
          pnpm --store-dir "$GATEWAY_TEST_PNPM_STORE" --dir packages/chat-adapter pack --pack-destination "$RUNNER_TEMP/gateway-packages"
          node scripts/release.mjs artifacts "$RUNNER_TEMP/gateway-packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform.architecture == 'amd64' && matrix.redis == '8.10.2'
        with:
          name: gateway-consumer-packages-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gateway-packages/*.tgz
            ${{ runner.temp }}/gateway-packages/SHA256SUMS
          if-no-files-found: error

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: qualify
    name: Publish ${{ matrix.platform.architecture }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Match the reviewed snapshot
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: test "$REVIEWED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Publish the qualified architecture
        env:
          TMPDIR: ${{ runner.temp }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          GATEWAY_EXPECTED_VERSION: ${{ needs.qualify.outputs.version }}
          GATEWAY_EXPECTED_REVISION: ${{ github.sha }}
          GATEWAY_ARCHITECTURE: ${{ matrix.platform.architecture }}
          GATEWAY_EXPECTED_PLATFORM: linux/${{ matrix.platform.architecture }}
        run: |
          image="ghcr.io/digows/whatsapp-gateway:$GITHUB_SHA-$GATEWAY_ARCHITECTURE"
          docker buildx create --name gateway-publication --driver docker-container --use
          docker buildx build --platform "$GATEWAY_EXPECTED_PLATFORM" --load --tag "$image" --build-arg "GATEWAY_REVISION=$GITHUB_SHA" --build-arg "GATEWAY_VERSION=$GATEWAY_EXPECTED_VERSION" --metadata-file "$RUNNER_TEMP/gateway-$GATEWAY_ARCHITECTURE-build.json" .
          python3 scripts/qualify-container.py "$image" > "$RUNNER_TEMP/gateway-$GATEWAY_ARCHITECTURE-container.json"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$image"
          docker image inspect "$image" > "$RUNNER_TEMP/gateway-$GATEWAY_ARCHITECTURE-published.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-image-${{ github.sha }}-${{ matrix.platform.architecture }}
          path: ${{ runner.temp }}/gateway-${{ matrix.platform.architecture }}-*.json
          if-no-files-found: error
      - name: Clear registry credentials and the owned builder
        if: always()
        run: |
          docker logout ghcr.io
          if docker buildx inspect gateway-publication > /dev/null 2>&1; then
            docker buildx rm gateway-publication
          fi

  manifest:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [qualify, publish]
    runs-on: ubuntu-24.04
    outputs:
      image_reference: ${{ steps.index.outputs.reference }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gateway-image-${{ github.sha }}-*
          path: ${{ runner.temp }}/gateway-images
          merge-multiple: true
      - name: Publish and verify the qualified multi-platform index
        id: index
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gateway-images'
          references=[]
          for architecture in ['amd64','arm64']:
              image=json.loads((root/f'gateway-{architecture}-published.json').read_text())[0]
              receipt=json.loads((root/f'gateway-{architecture}-container.json').read_text())
              assert image['Os']=='linux' and image['Architecture']==architecture
              assert image['Config']['Labels']['org.opencontainers.image.revision']==os.environ['GITHUB_SHA']
              assert image['Config']['Labels']['org.opencontainers.image.version']==os.environ['RELEASE_VERSION']
              assert receipt['qualifiedPlatform']==receipt['dockerHostPlatform']=='linux/'+architecture
              assert receipt['architecture']==('x64' if architecture=='amd64' else 'arm64')
              assert receipt['imageId']==image['Id']
              reference=next(value for value in image['RepoDigests'] if re.fullmatch(r'ghcr.io/digows/whatsapp-gateway@sha256:[a-f0-9]{64}',value))
              references.append(reference)
          (root/'references.txt').write_text('\n'.join(references)+'\n')
          PY
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          mapfile -t qualified_images < "$RUNNER_TEMP/gateway-images/references.txt"
          image="ghcr.io/digows/whatsapp-gateway:$GITHUB_SHA"
          docker buildx imagetools create --tag "$image" "${qualified_images[@]}"
          docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/gateway-index.json"
          docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" > "$RUNNER_TEMP/gateway-index-descriptor.json"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          index=json.loads((root/'gateway-index.json').read_text())
          expected={value.rsplit('@',1)[1] for value in (root/'gateway-images/references.txt').read_text().splitlines()}
          manifests=index['manifests']
          assert len(manifests)==2 and {value['digest'] for value in manifests}==expected
          assert {(value['platform']['os'],value['platform']['architecture']) for value in manifests}=={('linux','amd64'),('linux','arm64')}
          digest=json.loads((root/'gateway-index-descriptor.json').read_text())['digest']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}',digest)
          reference='ghcr.io/digows/whatsapp-gateway@'+digest
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('reference='+reference+'\n')
          (root/'gateway-reference.txt').write_text(reference+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('Qualified native platforms: linux/amd64, linux/arm64\nPublished '+reference+'\n')
          PY
          if [ -n "$RELEASE_TAG" ]; then
            reference=$(cat "$RUNNER_TEMP/gateway-reference.txt")
            major=${RELEASE_VERSION%%.*}
            for alias in "$RELEASE_VERSION" "$major" latest; do
              docker buildx imagetools create --tag "ghcr.io/digows/whatsapp-gateway:$alias" "$reference"
            done
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-index-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gateway-index*.json
            ${{ runner.temp }}/gateway-reference.txt
          if-no-files-found: error
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [qualify, manifest]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gateway-consumer-packages-${{ github.sha }}
          path: ${{ runner.temp }}/gateway-packages
      - name: Create the stable release from qualified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
          IMAGE_REFERENCE: ${{ needs.manifest.outputs.image_reference }}
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          (cd "$RUNNER_TEMP/gateway-packages" && sha256sum --check SHA256SUMS)
          node scripts/release.mjs artifacts "$RUNNER_TEMP/gateway-packages"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {RELEASE_VERSION,IMAGE_REFERENCE,GITHUB_SHA,RUNNER_TEMP}=process.env;
          if(!/^ghcr\.io\/digows\/whatsapp-gateway@sha256:[a-f0-9]{64}$/.test(IMAGE_REFERENCE))throw new Error('Release image digest unavailable');
          const notes=fs.readFileSync(`docs/releases/${RELEASE_VERSION}.md`,'utf8');
          fs.writeFileSync(RUNNER_TEMP+'/gateway-release-notes.md',notes+'\nCommit: '+GITHUB_SHA+'\n\nImage: '+IMAGE_REFERENCE+'\n\nQualified platforms: linux/amd64, linux/arm64.\n');
          JS
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "WhatsApp Gateway $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/gateway-release-notes.md" "$RUNNER_TEMP/gateway-packages/"*.tgz "$RUNNER_TEMP/gateway-packages/SHA256SUMS"
